# ClusterIP — internal access for K8s pods and ingress backend.
# UDP and TCP use different port numbers so they coexist in one service
# without kube-proxy iptables conflicts.
#
# DNS: app-monitor.monitoring.svc.cluster.local
# K8s pods: set GELF_HOST=app-monitor.monitoring.svc.cluster.local, GELF_PORT=12101
apiVersion: v1
kind: Service
metadata:
  name: app-monitor
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: app-monitor
  ports:
    - name: gelf-udp
      port: 12101
      targetPort: 12101
      protocol: UDP
    - name: gelf-tcp
      port: 12201
      targetPort: 12201
      protocol: TCP
    - name: cef-tcp
      port: 12202
      targetPort: 12202
      protocol: TCP
