# ClusterIP — used by K8s pods sending GELF directly.
# DNS: app-monitor.monitoring.svc.cluster.local
# Set GELF_HOST to this name in monitored pod specs.
apiVersion: v1
kind: Service
metadata:
  name: app-monitor
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: app-monitor
  ports:
    - name: gelf-udp
      port: 12201
      targetPort: 12201
      protocol: UDP
    - name: gelf-tcp
      port: 12201
      targetPort: 12201
      protocol: TCP
    - name: cef-tcp
      port: 12202
      targetPort: 12202
      protocol: TCP
