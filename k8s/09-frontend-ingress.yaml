# Dashboard frontend — ClusterIP service exposing port 4443 as the ingress backend.
# Kept in this file alongside the Ingress since both are purely frontend concerns.
apiVersion: v1
kind: Service
metadata:
  name: app-monitor-dashboard
  namespace: monitoring
spec:
  type: ClusterIP
  selector:
    app: app-monitor
  ports:
    - name: dashboard
      port: 4443
      targetPort: 4443
      protocol: TCP
---
# HTTPS dashboard ingress — nginx terminates TLS, forwards plain HTTP to backend.
#
# Before applying, create the TLS secret from the existing cert/key:
#   microk8s kubectl create secret tls app-monitor-tls \
#     --cert data/certs/ssl.lab.int.crt \
#     --key  data/certs/ssl.lab.int.key \
#     -n monitoring
#
# Access dashboard at: https://monitor.lab.int
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-monitor
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
spec:
  ingressClassName: public
  tls:
    - hosts:
        - monitor.lab.int
      secretName: app-monitor-tls
  rules:
    - host: monitor.lab.int
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-monitor-dashboard
                port:
                  number: 4443
