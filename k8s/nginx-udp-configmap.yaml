# Tells the MicroK8s nginx ingress controller to proxy UDP 12201 to app-monitor.
#
# Same apply + restart as nginx-tcp-configmap.yaml.
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-udp-microk8s-conf
  namespace: ingress
data:
  "12201": "monitoring/app-monitor:12201"  # GELF UDP  — from Docker hosts via gelf log driver
