# LoadBalancer — external access from Docker hosts and HSG.
# UDP 12101 and TCP 12201/12202 on different port numbers so mixed-protocol
# coexists in one service (one MetalLB IP).
apiVersion: v1
kind: Service
metadata:
  name: app-monitor-external
  namespace: monitoring
spec:
  type: LoadBalancer
  selector:
    app: app-monitor
  ports:
    - name: gelf-udp
      protocol: UDP
      port: 12101
      targetPort: 12101
    - name: gelf-tcp
      protocol: TCP
      port: 12201
      targetPort: 12201
    - name: cef-tcp
      protocol: TCP
      port: 12202
      targetPort: 12202
