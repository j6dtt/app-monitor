# External LoadBalancer — single MetalLB IP for all external inbound traffic.
# TCP and UDP use DIFFERENT port numbers (12201 vs 12101) so mixed-protocol
# coexists without conflict on the same service.
#
# TCP 12201 — GELF from Docker hosts (gelf log driver, tcp://)
# TCP 12202 — CEF from HSG security device
# UDP 12101 — GELF from Docker hosts configured with udp:// gelf-address
#
# If VKS rejects mixed-protocol on a single LoadBalancer, split into two services:
#   app-monitor-external-tcp (TCP 12201+12202) and app-monitor-external-udp (UDP 12101)
apiVersion: v1
kind: Service
metadata:
  name: app-monitor-external
  namespace: monitoring
spec:
  type: LoadBalancer
  selector:
    app: app-monitor
  ports:
    - name: gelf-tcp
      protocol: TCP
      port: 12201
      targetPort: 12201
    - name: cef-tcp
      protocol: TCP
      port: 12202
      targetPort: 12202
    - name: gelf-udp
      protocol: UDP
      port: 12101
      targetPort: 12101
