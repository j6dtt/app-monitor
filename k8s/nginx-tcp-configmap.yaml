# Tells the MicroK8s nginx ingress controller to proxy these TCP ports
# directly to the app-monitor ClusterIP service.
#
# The ingress controller runs with hostNetwork: true, so nginx listens on
# these ports on the node itself — no NodePort range extension required.
#
# Apply this to the ingress namespace (where the nginx controller lives):
#   microk8s kubectl apply -f nginx-tcp-configmap.yaml
#
# After applying, the nginx ingress controller pod may need a restart to
# pick up the new entries:
#   microk8s kubectl rollout restart daemonset nginx-ingress-microk8s-controller -n ingress
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-ingress-tcp-microk8s-conf
  namespace: ingress
data:
  "12201": "monitoring/app-monitor:12201"  # GELF TCP  — from Docker hosts via logship/HSG
  "12202": "monitoring/app-monitor:12202"  # CEF TCP   — from HSG (CEF→GELF conversion)
