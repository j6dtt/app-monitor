# HTTPS dashboard ingress — routes external HTTPS traffic to app-monitor port 4443.
#
# app-monitor handles TLS itself (with certs/ssl.lab.int.crt).
# nginx passes the connection through to the backend as HTTPS.
#
# Prerequisites:
#   microk8s enable ingress
#
# Access dashboard at: https://monitor.lab.int
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-monitor
  namespace: monitoring
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-passthrough: "true"
spec:
  ingressClassName: public
  rules:
    - host: monitor.lab.int
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-monitor
                port:
                  number: 4443
